name: Backup production Storage
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-storage-backup
  cancel-in-progress: false
jobs:
  backup:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check backup credentials
        env:
          PROD_ACCESS_KEY_ID: ${{ secrets.PROD_S3_ACCESS_KEY_ID }}
          PROD_SECRET_ACCESS_KEY: ${{ secrets.PROD_S3_SECRET_ACCESS_KEY }}
          STAGING_ACCESS_KEY_ID: ${{ secrets.TEST_S3_ACCESS_KEY_ID }}
          STAGING_SECRET_ACCESS_KEY: ${{ secrets.TEST_S3_SECRET_ACCESS_KEY }}
        shell: bash
        run: |
          if [ -z "$PROD_ACCESS_KEY_ID" ] || [ -z "$PROD_SECRET_ACCESS_KEY" ] || [ -z "$STAGING_ACCESS_KEY_ID" ] || [ -z "$STAGING_SECRET_ACCESS_KEY" ]; then
            echo "::error::Storage backup secrets are not configured. Nothing copied."
            exit 1
          fi
      - name: Install boto3
        run: python -m pip install --quiet boto3
      - name: Copy and verify production objects
        env:
          PROD_ACCESS_KEY_ID: ${{ secrets.PROD_S3_ACCESS_KEY_ID }}
          PROD_SECRET_ACCESS_KEY: ${{ secrets.PROD_S3_SECRET_ACCESS_KEY }}
          STAGING_ACCESS_KEY_ID: ${{ secrets.TEST_S3_ACCESS_KEY_ID }}
          STAGING_SECRET_ACCESS_KEY: ${{ secrets.TEST_S3_SECRET_ACCESS_KEY }}
          PROD_ENDPOINT: https://ozmulwqzybhiekmolvyk.storage.supabase.co/storage/v1/s3
          STAGING_ENDPOINT: https://bvjjnzhhxieyxkeorurb.storage.supabase.co/storage/v1/s3
          SOURCE_BUCKET: lti-documents
          BACKUP_BUCKET: lti-production-backup
          AWS_REGION: ap-southeast-1
        run: python scripts/backup-storage.py
