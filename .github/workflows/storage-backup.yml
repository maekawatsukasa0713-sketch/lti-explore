name: Backup production Storage

on:
  schedule:
    - cron: '30 18 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      PROD_ACCESS_KEY_ID: ${{ secrets.LTI_PROD_S3_ACCESS_KEY_ID }}
      PROD_SECRET_ACCESS_KEY: ${{ secrets.LTI_PROD_S3_SECRET_ACCESS_KEY }}
      STAGING_ACCESS_KEY_ID: ${{ secrets.LTI_STAGING_S3_ACCESS_KEY_ID }}
      STAGING_SECRET_ACCESS_KEY: ${{ secrets.LTI_STAGING_S3_SECRET_ACCESS_KEY }}
    steps:
      - name: Check backup credentials
        id: secrets
        shell: bash
        run: |
          if [ -z "$PROD_ACCESS_KEY_ID" ] || [ -z "$PROD_SECRET_ACCESS_KEY" ] || [ -z "$STAGING_ACCESS_KEY_ID" ] || [ -z "$STAGING_SECRET_ACCESS_KEY" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Storage backup secrets are not configured. Backup was skipped."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install boto3
        if: steps.secrets.outputs.ready == 'true'
        run: python -m pip install --quiet boto3

      - name: Copy production objects to isolated backup bucket
        if: steps.secrets.outputs.ready == 'true'
        env:
          PROD_ENDPOINT: https://ozmulwqzybhiekmolvyk.storage.supabase.co/storage/v1/s3
          STAGING_ENDPOINT: https://bvjjnzhhxieyxkeorurb.storage.supabase.co/storage/v1/s3
          SOURCE_BUCKET: lti-documents
          BACKUP_BUCKET: lti-production-backup
          AWS_REGION: ap-southeast-1
        run: |
          python - <<'PY'
          import os
          import boto3
          from botocore.config import Config

          cfg = Config(signature_version='s3v4', s3={'addressing_style':'path'})
          source = boto3.client(
              's3',
              endpoint_url=os.environ['PROD_ENDPOINT'],
              aws_access_key_id=os.environ['PROD_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['PROD_SECRET_ACCESS_KEY'],
              region_name=os.environ['AWS_REGION'],
              config=cfg,
          )
          dest = boto3.client(
              's3',
              endpoint_url=os.environ['STAGING_ENDPOINT'],
              aws_access_key_id=os.environ['STAGING_ACCESS_KEY_ID'],
              aws_secret_access_key=os.environ['STAGING_SECRET_ACCESS_KEY'],
              region_name=os.environ['AWS_REGION'],
              config=cfg,
          )

          source_bucket = os.environ['SOURCE_BUCKET']
          dest_bucket = os.environ['BACKUP_BUCKET']
          paginator = source.get_paginator('list_objects_v2')
          copied = 0
          skipped = 0
          failed = []

          for page in paginator.paginate(Bucket=source_bucket):
              for item in page.get('Contents', []):
                  key = item['Key']
                  source_size = item['Size']
                  try:
                      try:
                          existing = dest.head_object(Bucket=dest_bucket, Key=key)
                          if int(existing.get('ContentLength', -1)) == int(source_size):
                              skipped += 1
                              continue
                      except Exception:
                          pass

                      obj = source.get_object(Bucket=source_bucket, Key=key)
                      kwargs = {
                          'Bucket': dest_bucket,
                          'Key': key,
                          'Body': obj['Body'],
                          'ContentType': obj.get('ContentType', 'application/octet-stream'),
                      }
                      if obj.get('CacheControl'):
                          kwargs['CacheControl'] = obj['CacheControl']
                      if obj.get('ContentDisposition'):
                          kwargs['ContentDisposition'] = obj['ContentDisposition']
                      if obj.get('Metadata'):
                          kwargs['Metadata'] = obj['Metadata']
                      dest.put_object(**kwargs)
                      obj['Body'].close()
                      copied += 1
                  except Exception as exc:
                      failed.append((key, str(exc)))

          print(f'copied={copied} skipped={skipped} failed={len(failed)}')
          if failed:
              for key, error in failed[:20]:
                  print(f'FAILED {key}: {error}')
              raise SystemExit(1)
          PY
