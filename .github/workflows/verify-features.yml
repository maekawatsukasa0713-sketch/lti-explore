name: Verify school features and AI registration
on:
  push:
    branches: [fix/school-features]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: python tests/storage-backup.test.py
      - run: python tests/storage-restore.test.py
      - run: npm ci --prefix tests/backend-security
      - run: npm test --prefix tests/backend-security
      - run: node tests/backend-security/support.mjs
      - run: npm run build
