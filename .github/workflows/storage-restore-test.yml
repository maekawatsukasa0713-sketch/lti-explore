name: Recover temporary Storage restore cleanup
on:
  workflow_dispatch:
    inputs:
      expected_files:
        description: Expected backup file count
        required: true
        default: '539'
        type: string
  push:
    branches: [codex/storage-restore-test-20261009]
    paths:
      - scripts/restore-storage-test.py
      - tests/storage-restore.test.py
      - .github/workflows/storage-restore-test.yml
permissions:
  contents: read
concurrency:
  group: staging-storage-restore-verification
  cancel-in-progress: false
jobs:
  restore:
    if: github.repository == 'maekawatsukasa0713-sketch/lti-explore' && ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'push' && github.ref == 'refs/heads/codex/storage-restore-test-20261009'))
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test restore failure and cleanup guards
        run: python tests/storage-restore.test.py
      - name: Install pinned restore dependencies
        run: python -m pip install --quiet boto3==1.43.110 PyMuPDF==1.28.2
      - name: Remove verified temporary copies from the first restore run
        env:
          TEST_ACCESS_KEY_ID: ${{ secrets.TEST_S3_ACCESS_KEY_ID }}
          TEST_SECRET_ACCESS_KEY: ${{ secrets.TEST_S3_SECRET_ACCESS_KEY }}
          EXPECTED_FILES: ${{ inputs.expected_files || '539' }}
          CLEANUP_ONLY_RUN_ID: '37919241574'
          CLEANUP_ONLY_RUN_ATTEMPT: '1'
        run: python scripts/restore-storage-test.py
