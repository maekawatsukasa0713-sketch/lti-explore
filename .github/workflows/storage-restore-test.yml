name: Verify private Storage restore
on:
  workflow_dispatch:
    inputs:
      snapshot_id:
        description: Completed snapshot ID in the backup project
        required: true
        type: string
      expected_files:
        description: Optional expected count (uses snapshot manifest count when empty)
        required: false
        default: ''
        type: string
permissions:
  contents: read
concurrency:
  group: production-storage-recovery
  cancel-in-progress: false
jobs:
  restore:
    if: github.repository == 'maekawatsukasa0713-sketch/lti-explore' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test restore failure and cleanup guards
        run: python tests/storage-restore.test.py
      - name: Install pinned restore dependencies
        run: python -m pip install --quiet boto3==1.43.110 PyMuPDF==1.28.2
      - name: Restore, verify contents and document opening, then remove test copies
        env:
          BACKUP_ACCESS_KEY_ID: ${{ secrets.PROD_S3_ACCESS_KEY_ID }}
          BACKUP_SECRET_ACCESS_KEY: ${{ secrets.PROD_S3_SECRET_ACCESS_KEY }}
          EXPECTED_FILES: ${{ inputs.expected_files }}
          RESTORE_SNAPSHOT_ID: ${{ inputs.snapshot_id }}
        run: python scripts/restore-storage-test.py
